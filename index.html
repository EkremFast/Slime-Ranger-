<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slime Ranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fae;--pink2:#ff9ccc;--teal:#3fe0d0;--navy:#1b2766;--navy2:#2a3f8f;--gold:#ffd23b;--green:#4cd964}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:Nunito,system-ui,sans-serif;font-weight:800;color:#fff;user-select:none}
canvas{display:block}
.hidden{display:none!important}
.disp{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;letter-spacing:.5px}
.stroke{text-shadow:0 2px 0 #0006,2px 0 0 #1b2766,-2px 0 0 #1b2766,0 2px 0 #1b2766,0 -2px 0 #1b2766,2px 2px 0 #1b2766,-2px -2px 0 #1b2766,2px -2px 0 #1b2766,-2px 2px 0 #1b2766}
#hud{position:fixed;inset:0;pointer-events:none}
/* clock + money */
#clockbox{position:absolute;left:18px;top:16px;display:flex;align-items:center;gap:10px}
#dial{width:64px;height:64px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 #0004;background:#1b2766}
#day{font-size:26px}#time{font-size:17px;opacity:.95}
#money{position:absolute;left:18px;top:92px;display:flex;align-items:center;gap:8px;background:linear-gradient(#2a3f8fe0,#1b2766e0);border:3px solid #fff;border-radius:999px;padding:3px 16px 3px 4px;box-shadow:0 4px 0 #0004}
.coin{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffd23b 45%,#e09a10);color:#7a4a00;font-family:'Lilita One';font-size:20px;border:2px solid #fff;box-shadow:inset 0 -3px 0 #c07a00}
.coin.sm{width:20px;height:20px;font-size:12px;border-width:1px;vertical-align:-4px;box-shadow:inset 0 -2px 0 #c07a00}
#nb{font-size:28px}
/* banner */
#banner{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s}
#banner .t{font-size:60px;color:#fff}#banner .s{font-size:20px;color:var(--gold)}
/* goals */
#goals{position:absolute;right:18px;top:16px;width:240px;background:linear-gradient(#2a3f8fd0,#1b2766d0);border:3px solid #fff;border-radius:18px;padding:10px 14px;font-size:13px;line-height:1.35;box-shadow:0 4px 0 #0004}
#goals .h{font-size:18px;color:var(--gold);margin-bottom:4px}
#goals .done{opacity:.45;text-decoration:line-through}
#goals.mini .g{display:none}
/* vitals */
#vitals{position:absolute;left:18px;bottom:18px;display:flex;flex-direction:column;gap:9px}
.vit{display:flex;align-items:center;position:relative;height:30px}
.vi{width:38px;height:38px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:19px;z-index:2;box-shadow:0 3px 0 #0005;position:relative}
.vb{width:230px;height:22px;margin-left:-12px;border:3px solid #fff;border-radius:0 14px 14px 0;background:#1b2766c0;overflow:hidden;box-shadow:0 3px 0 #0004}
.vb i{display:block;height:100%;transition:width .15s;box-shadow:inset 0 5px 0 #ffffff55}
.vit span{position:absolute;left:44px;top:5px;font-size:13px;z-index:3;text-shadow:0 1px 2px #000}
/* inventory */
#inv{position:absolute;right:18px;bottom:16px;text-align:right}
#selname{font-size:24px;margin-bottom:6px;color:#fff}
#slots{display:flex;gap:8px;align-items:flex-end}
.slot{width:72px;height:72px;border-radius:16px;background:radial-gradient(circle at 50% 35%,#3a55b0e0,#1b2766e8);border:3px solid #ffffffb0;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #0005;transition:transform .12s}
.slot.sel{border-color:var(--gold);transform:scale(1.14) translateY(-4px);box-shadow:0 0 0 3px #ffd23b55,0 6px 0 #0005}
.slot img{width:60px;height:60px;filter:drop-shadow(0 3px 2px #0006)}
.slot .n{position:absolute;right:6px;bottom:2px;font-size:17px}
.slot .k{position:absolute;left:7px;top:3px;font-size:12px;opacity:.7}
.slot .bar{position:absolute;left:6px;right:6px;bottom:4px;height:5px;border-radius:3px;background:#0006;overflow:hidden}
.slot .bar i{display:block;height:100%;background:var(--teal)}
.drop{width:34px;height:42px;background:radial-gradient(circle at 35% 35%,#d6f6ff,#4fc3ff 50%,#1a7ad8);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:rotate(0deg);clip-path:path('M17 0 C17 0 34 20 34 28 A17 14 0 0 1 0 28 C0 20 17 0 17 0 Z')}
/* reticle */
#reticle{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px}
#reticle .ring{position:absolute;inset:0;border:3px solid #ffffffd0;border-radius:50%;box-shadow:0 0 4px #0008}
#reticle .dot{position:absolute;left:14px;top:14px;width:6px;height:6px;background:#fff;border-radius:50%}
#reticle.on .ring{border-color:var(--teal);transform:scale(.85)}
#target{position:absolute;left:50%;top:calc(50% + 30px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#1b2766c8;border:2px solid #fff8;border-radius:14px;padding:4px 12px 4px 6px;font-size:14px;white-space:nowrap}
#target img{width:30px;height:30px}
#target:empty{display:none}
#prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:linear-gradient(#2a3f8fe8,#1b2766e8);border:3px solid #fff;padding:7px 18px 7px 8px;border-radius:999px;font-size:17px;box-shadow:0 4px 0 #0005;display:flex;align-items:center;gap:10px}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:#fff;color:#1b2766;font-family:'Lilita One';font-size:17px;box-shadow:inset 0 -4px 0 #c8d0ea}
#toasts{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{display:flex;align-items:center;gap:10px;background:linear-gradient(#2a3f8ff0,#1b2766f0);border:3px solid #fff;padding:7px 18px 7px 10px;border-radius:16px;font-size:16px;box-shadow:0 4px 0 #0005;animation:tin .3s cubic-bezier(.3,1.6,.6,1);max-width:640px}
.toast img{width:36px;height:36px}
.toast.new{border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 180px #7ff3ff80;opacity:0;transition:opacity .15s}
#hurt{position:absolute;inset:0;box-shadow:inset 0 0 200px #ff2a4ac0;opacity:0;transition:opacity .25s}
#radfx{position:absolute;inset:0;box-shadow:inset 0 0 220px #9cff3a;opacity:0}
/* panels */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(#0c133580,#0c1335d0);pointer-events:auto}
.panel{background:linear-gradient(170deg,#3550a8,#1b2766 60%);border:5px solid #fff;border-radius:28px;max-width:900px;width:93vw;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 0 #0006,0 30px 80px #000a;overflow:hidden}
.ph{background:linear-gradient(#ff8cc0,#ff5fa2);padding:10px 22px;display:flex;align-items:center;gap:12px;border-bottom:4px solid #fff}
.ph .ttl{font-size:32px}
.ph .x{margin-left:auto;font-size:13px;opacity:.85}
.pb{padding:16px 22px;overflow:auto}
.pb p{margin:6px 0 10px;line-height:1.4;font-weight:700;opacity:.95}
h3{font-family:'Lilita One';font-weight:400;font-size:20px;color:var(--gold);margin:14px 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{font-family:'Lilita One';font-size:17px;background:#ffffff22;color:#fff;border:3px solid #ffffff55;border-radius:999px;padding:5px 16px;cursor:pointer}
.tab.on{background:var(--gold);color:#1b2766;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;color:#1b2766;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 5px 0 #0003;position:relative}
.card .top{display:flex;align-items:center;gap:10px}
.card .ic{width:52px;height:52px;flex:none;border-radius:14px;background:#e8eeff;display:flex;align-items:center;justify-content:center;font-size:28px}
.card .ic img{width:48px;height:48px}
.card b{font-family:'Lilita One';font-weight:400;font-size:19px}
.card .d{font-size:13px;font-weight:700;color:#4a5590}
.card .lv{font-size:12px;color:#8a93c0}
.card .ok{color:#27a844;font-family:'Lilita One';font-size:16px}
.buy{font-family:'Lilita One';font-size:17px;background:linear-gradient(#6ff08a,#34c759);color:#fff;border:3px solid #fff;border-radius:14px;padding:6px 14px;cursor:pointer;box-shadow:0 4px 0 #1e8a3a;text-shadow:0 2px 0 #1e8a3a;display:inline-flex;align-items:center;gap:6px;margin-top:4px;align-self:flex-start}
.buy:hover{filter:brightness(1.08)}.buy:active{transform:translateY(2px);box-shadow:0 2px 0 #1e8a3a}
.buy:disabled{background:#b8bfd8;box-shadow:0 4px 0 #8890b0;text-shadow:none;cursor:default}
.buy.alt{background:linear-gradient(#8fd8ff,#3fa0f0);box-shadow:0 4px 0 #1c64a8;text-shadow:0 2px 0 #1c64a8}
.buy.red{background:linear-gradient(#ff9a9a,#f04a5a);box-shadow:0 4px 0 #a82030;text-shadow:0 2px 0 #a82030}
.big{font-size:24px;padding:10px 30px}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:15px}
td,th{padding:6px 10px;text-align:left}
tr.row td{background:#fff;color:#1b2766}tr.row td:first-child{border-radius:12px 0 0 12px}tr.row td:last-child{border-radius:0 12px 12px 0}
th{font-family:'Lilita One';font-weight:400;color:var(--gold)}
.up{color:#1fa83c}.dn{color:#e0304a}
.mini-ic{width:30px;height:30px;vertical-align:middle;margin-right:6px}
.keys td{background:#ffffff14}.keys td:first-child{font-family:'Lilita One';color:var(--gold);white-space:nowrap;border-radius:10px 0 0 10px}.keys td:last-child{border-radius:0 10px 10px 0}
/* slimepedia */
.pedia{display:grid;grid-template-columns:220px 1fr;gap:14px}
.plist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto;padding-right:4px}
.pitem{display:flex;align-items:center;gap:8px;background:#ffffff18;border-radius:12px;padding:4px 8px;cursor:pointer;font-family:'Lilita One';font-size:16px;border:3px solid transparent}
.pitem.on{background:#fff;color:#1b2766;border-color:var(--gold)}
.pitem img{width:36px;height:36px}
.pdet{background:#fff;color:#1b2766;border-radius:18px;padding:16px}
.pdet .hero{display:flex;gap:16px;align-items:center}
.pdet .hero>img{width:130px;height:130px;background:radial-gradient(#e8eeff,#c8d4ff);border-radius:24px}
.pdet .nm{font-family:'Lilita One';font-size:34px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.fact{background:#eef2ff;border-radius:12px;padding:8px 10px;font-size:13px}
.fact b{display:block;font-family:'Lilita One';font-weight:400;font-size:15px;color:#ff5fa2}
/* start */
#start{background:linear-gradient(#0c133500,#0c133590)}
.logo{font-family:'Lilita One';font-size:92px;line-height:.9;color:#ff8cc0;text-align:center;-webkit-text-stroke:6px #fff;paint-order:stroke fill;text-shadow:0 8px 0 #c2357a,0 14px 24px #0008;transform:rotate(-3deg)}
.logo span{color:#3fe0d0;text-shadow:0 8px 0 #1a8f86,0 14px 24px #0008}
.sub{font-size:20px;text-align:center;margin:18px 0 26px;text-shadow:0 2px 6px #000}
.menuBtns{display:flex;flex-direction:column;gap:12px;align-items:center}
.menuBtns .buy{align-self:center;min-width:260px;justify-content:center}
.hint{font-size:13px;opacity:.8;text-align:center;margin-top:18px;text-shadow:0 1px 3px #000}
input[type=range]{width:220px}
.opt{display:flex;align-items:center;gap:12px;margin:10px 0}
.seg{display:inline-flex;gap:6px}

.shop{display:grid;grid-template-columns:1fr 300px;gap:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;align-content:start}
.tile{position:relative;background:linear-gradient(#4f70d8,#2f45a0);border:3px solid #ffffff80;border-radius:16px;padding:8px 6px 6px;text-align:center;cursor:pointer;box-shadow:0 4px 0 #0005;transition:transform .1s}
.tile:hover{transform:translateY(-2px)}
.tile.on{border-color:var(--gold);background:linear-gradient(#7090f4,#3a55c0);box-shadow:0 0 0 3px #ffd23b66,0 4px 0 #0005}
.tile .ti{font-size:40px;height:54px;display:flex;align-items:center;justify-content:center}
.tile .ti img{width:54px;height:54px}
.tile .tn{font-family:'Lilita One';font-size:14px;line-height:1.1;margin-top:2px}
.tile .tp{font-size:12px;margin-top:4px;background:#0004;border-radius:999px;padding:2px 7px;display:inline-block}
.tile .badge{position:absolute;right:-7px;top:-7px;width:26px;height:26px;border-radius:50%;background:#34c759;border:3px solid #fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.tile.owned{opacity:.8}.tile.lock{filter:grayscale(.75);opacity:.7}
.det{background:#fff;color:#1b2766;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 5px 0 #0003;align-self:start;position:sticky;top:0}
.det .bigic{height:120px;border-radius:16px;background:radial-gradient(#ffffff,#d3ddff);display:flex;align-items:center;justify-content:center;font-size:72px}
.det .bigic img{width:110px;height:110px}
.det .dn{font-family:'Lilita One';font-size:26px;line-height:1.05}
.det .dd{font-size:14px;font-weight:700;color:#4a5590;line-height:1.35}
.det .lvl{display:flex;gap:5px}.det .lvl i{width:24px;height:9px;border-radius:5px;background:#d6dcf0}.det .lvl i.on{background:#ff6fae}
.det .price{font-family:'Lilita One';font-size:26px;display:flex;align-items:center;gap:8px}
.purchase{font-size:22px!important;width:100%;justify-content:center;align-self:stretch!important;padding:10px!important}
#feed{position:absolute;right:22px;bottom:150px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.fi{display:flex;align-items:center;gap:6px;background:linear-gradient(#2a3f8fe0,#1b2766e0);border:2px solid #fff;border-radius:12px;padding:2px 12px 2px 4px;font-size:15px;animation:tin .2s;box-shadow:0 3px 0 #0004}
.fi img{width:30px;height:30px}
.pmenu{display:grid;grid-template-columns:290px 1fr;gap:26px;width:min(1000px,94vw);align-items:start}
.pside{display:flex;flex-direction:column;gap:12px}
.pside .buy{align-self:stretch;justify-content:flex-start;font-size:22px;padding:12px 20px}
.pside .logo{font-size:58px;-webkit-text-stroke:5px #fff;margin-bottom:10px;text-align:left}
.mtile{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.mt{background:#fff;color:#1b2766;border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 #0003}
.mt img{width:52px;height:52px}.mt .mp{font-family:'Lilita One';font-size:24px;line-height:1}.mt .mn{font-size:13px;color:#4a5590}
.mt .buy{font-size:14px;padding:5px 10px;margin:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat div{background:#fff;color:#1b2766;border-radius:14px;padding:10px;text-align:center;font-size:13px}.stat b{display:block;font-family:'Lilita One';font-weight:400;font-size:26px;color:#ff5fa2}
</style>
</head>
<body>
<!-- C-L-O-C-K STUDIOS INTRO -->
<script>
/* ==================================================================
   C-L-O-C-K  STUDIOS  —  GAME INTRO
   ==================================================================

   HOW TO ADD THIS TO ANY GAME (only 2 steps):
   ------------------------------------------------------------------
   1) Put this file (clock-intro.js) in the same folder as your game.

   2) In your game's HTML file, paste this line as the FIRST thing
      inside <body> (before your game's own scripts):

          <script src="clock-intro.js"><\/script>

      That's it! The intro now plays before your game every time
      the page loads.

   OPTIONAL — make your game wait until the intro is finished:
   ------------------------------------------------------------------
      if (window.ClockIntro) {
          ClockIntro.onDone(startMyGame);   // wait for the intro
      } else {
          startMyGame();                    // no intro found? start anyway
      }

   "ClockIntro is not defined" ERROR?
      That means the game page could not find clock-intro.js.
      Make sure the file is in the SAME folder as your game's .html
      file and the name is spelled exactly: clock-intro.js

   OTHER THINGS YOU CAN CALL:
      ClockIntro.skip();   // ends the intro right away
      ClockIntro.play();   // plays the intro again

   HOW TO CHANGE THINGS:
   ------------------------------------------------------------------
   Look at the SETTINGS box right below. You can change the words,
   colors, sound, and timing there. You do NOT need to touch any
   other part of the code.

   NOTE: Lines that start with //  and text between  /*  and  * /
   are COMMENTS. The computer ignores them — they are only notes
   for people reading the code. Write your own notes the same way!
   ================================================================== */

(function () {

  // ================================================================
  //  SETTINGS  —  change these!
  // ================================================================
  var SETTINGS = {
    studioName: "CLOCK",     // the big word (letters A-Z, 0-9)
    letterSeparator: "-",    // what goes between letters ("" for none)
    subtitle: "STUDIOS",     // the small word at the bottom

    sound: true,             // true = play sounds, false = silent
    tapToStart: true,        // true = "press any key" screen first
                             //   (browsers only allow sound after
                             //    the player clicks or presses a key)
    canSkip: true,           // true = click / press a key to skip
    playEveryTime: true,     // false = only plays once per visit
    holdTime: 1600,          // how long (ms) the finished logo stays

    colors: {
      background: "#0b0410", // screen color
      light: "#ffcd76",      // clock yellow
      mid: "#f39a4a",        // clock orange
      dark: "#b8365a",       // clock red
      outline: "#14121f",    // letter outline
      shadow: "#5a2456",     // letter shadow (clock purple)
      face: "#2a1230",       // inside of the clock
      swirlLight: "#a8f4ff", // swirl: light blue
      swirlMid: "#2f9bff",   // swirl: blue
      swirlDark: "#4b3bff"   // swirl: deep blue
    }
  };
  // ================================================================
  //  (You don't need to change anything below this line.)
  // ================================================================


  // Your logo picture, saved inside the code (so no extra file is needed).

  var C = SETTINGS.colors;

  var finished = false;

  // ---------- Public controls (ClockIntro.onDone / skip / play) ----------
  window.ClockIntro = {
    onDone: function (fn) {
      if (finished) fn(); else doneCallbacks.push(fn);

    skip: function () { if (active) finish(true); },
    play: function () { if (!active) start(true); },
    settings: SETTINGS
  };

  // ---------- Pixel letters (hand-made 5x7 pixel font, matches the clock) ----------

  // ---------- Glowing embers + spark burst ----------
  function startSparks(canvas, logo) {

      if (Math.random() < 0.35) add(Math.random() * W, H + 10, (Math.random() - .5) * 20 * dpr,

  // ---------- Keys: start / skip, and keep them away from the game ----------
  var waitingForStart = false, startedAt = 0;

  function beginFromPrompt() {
    waitingForStart = false;

  // ---------- Start & finish ----------
  function start(force) {

    var list = doneCallbacks; doneCallbacks = [];

  }

  // Wait for the page to be ready, then play
  if (document.body) start(false);
  else document.addEventListener("DOMContentLoaded", function () { start(false); });

    const px=e.pos.x,pz=e.pos.z;let g=GRAV;if(e.sucked)g=0;else if(e.kind==='slime'&&has(e,'sun'))g*=.45;else if(e.kind==='water')g*=.8;

      if(pl.type==='garden'&&!pl.crop&&e.kind==='food'&&!isChicken(e)&&e.home!=='garden'){pl.crop=e.type;pl.growT=0;pl.ripe=false;kill(e);buildPlotMesh(pl);toast(`Planted ${FOODS[e.type].name}!`,'food:'+e.type);sfx('buy');continue}

    e.mesh.position.copy(e.pos);

function craft(k){if(k==='turret'){st.turrets++;placeTurrets();toast('Hydro Turret installed!')}else if(k==='tele'){st.gadgets.tele+=3;toast('Teleporter charged: press H to warp home.')}else if(k==='toy'){st.gadgets.toy++;toast('Beach Ball crafted — give it to a corral.')}else{st.gadgets[k]=true;toast(GADGETS[k].name+' ready! '+GADGETS[k].d)}}

function feed(id){const now=performance.now();let f=feedMap[id];const kill_=()=>{f.el.remove();delete feedMap[id]};if(f){f.n++;f.el.querySelector('span').textContent=`+${f.n} ${itemName(id)}`;clearTimeout(f.to);f.to=setTimeout(()=>{f.el.remove();delete feedMap[id]},1800);return}
  const el=document.createElement('div');el.className='fi';el.innerHTML=`<img src="${icon(id)}"><span class="disp stroke">+1 ${itemName(id)}</span>`;feedEl.prepend(el);while(feedEl.children.length>5)feedEl.lastChild.remove();f=feedMap[id]={el,n:1};f.to=setTimeout(()=>{el.remove();delete feedMap[id]},1800)}
function toast(s,ic=null,isNew=false){const d=document.createElement('div');d.className='toast'+(isNew?' new':'');d.innerHTML=(ic?`<img src="${icon(ic)}">`:'')+`<span></span>`;d.querySelector('span').textContent=s;toastEl.appendChild(d);while(toastEl.children.length>4)toastEl.firstChild.remove();setTimeout(()=>d.remove(),5000)}
function clock(){const h=Math.floor(st.time),m=Math.floor((st.time-h)*60);return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
const QUESTS=[['vac','Vac up a wild slime in the Dry Reef (east)'],['sell','Feed slimes & sell plorts at the Plort Market'],['quarry','Feed the Pink Gordo (50 food) to open the Indigo Quarry'],['moss','Pop the Rock Gordo for a Slime Key → Moss Blanket'],['largo','Make a Largo in one of your corrals'],['lab','Buy The Lab (₦10,000)'],['ext','Deploy an Extractor'],['tarr','Spray a Tarr with water'],['rex','Finish a Range Exchange job'],['zee','Reach 7Zee Rank 1']];
const dialC=$('dial').getContext('2d');
function drawDial(){const c=dialC,t=st.time;c.clearRect(0,0,128,128);const day=!isNight();const g=c.createRadialGradient(64,64,10,64,64,64);g.addColorStop(0,day?'#bfe8ff':'#3a4590');g.addColorStop(1,day?'#4aa8f0':'#0e1440');c.fillStyle=g;c.beginPath();c.arc(64,64,64,0,7);c.fill();
  c.fillStyle=day?'#6cc04a':'#24402a';c.beginPath();c.arc(64,64,64,0,Math.PI);c.fill();
  const a=Math.PI+(t-6)/12*Math.PI;const x=64+Math.cos(a)*40,y=64+Math.sin(a)*40;
  if(day){c.fillStyle='#ffd23b';c.beginPath();c.arc(x,y,15,0,7);c.fill();c.fillStyle='#fff7b0';c.beginPath();c.arc(x-4,y-4,6,0,7);c.fill()}
  else{const a2=a+Math.PI,x2=64+Math.cos(a2)*40,y2=64+Math.sin(a2)*40;c.fillStyle='#f0f4ff';c.beginPath();c.arc(x2,y2,14,0,7);c.fill();c.fillStyle='#3a4590';c.beginPath();c.arc(x2+6,y2-4,12,0,7);c.fill();for(let i=0;i<6;i++){c.fillStyle='#fff';c.fillRect(20+i*17,20+(i%3)*10,2,2)}}}
let slotsKey='';
function hudUpdate(force){hudT-=1/60;if(!force&&hudT>0)return;hudT=.1;{const u=unreadMail();if(u>lastUnread)toast('New Starmail! Check the mailbox by your house.',null,true);lastUnread=u}
  $('nb').textContent=Math.floor(st.nb).toLocaleString();$('day').textContent='Day '+st.day+(st.keys?'  🔑'+st.keys:'')+(st.gadgets.tele?'  ⚡'+st.gadgets.tele:'');$('time').textContent=clock();drawDial();
  const z=zoneAt(P.pos.x,P.pos.z);const zid=z?z.id:null;if(zid&&zid!==lastZone){lastZone=zid;$('bt').textContent=z.name.toUpperCase();$('bs').textContent=z.sub;$('banner').style.opacity=1;bannerT=3}
  bannerT-=.1;if(bannerT<=0)$('banner').style.opacity=0;
  st.q.quarry=st.gates.quarry?1:0;st.q.moss=st.gates.moss?1:0;st.q.lab=st.exp.lab?1:0;
  const left=QUESTS.filter(([k])=>!st.q[k]);$('goals').innerHTML='<div class="h disp">Rancher Goals</div>'+QUESTS.map(([k,t])=>`<div class="g ${st.q[k]?'done':''}">• ${t}</div>`).join('');
  const mh=maxHp(),me=maxEn();
  $('hpb').style.width=(P.hp/mh*100)+'%';$('hpt').textContent=`${Math.ceil(P.hp)} / ${mh}`;$('enb').style.width=(P.en/me*100)+'%';$('ent').textContent=`${Math.ceil(P.en)} / ${me}`;
  $('radrow').style.visibility=P.rad>1?'visible':'hidden';$('rdb').style.width=P.rad+'%';$('rdt').textContent='RADS';$('radfx').style.opacity=P.rad/160;
  const cap=slotCap(),wc=waterCap();const key=JSON.stringify(st.inv)+P.sel+cap+Math.floor(st.water)+wc;
  if(key!==slotsKey){slotsKey=key;let sh='';for(let i=0;i<NS;i++){const s=st.inv[i];sh+=`<div class="slot ${P.sel===i?'sel':''}"><span class="k">${i+1}</span>${s?`<img src="${icon(s.id)}"><span class="n disp stroke">${s.n}</span>`:''}</div>`}
    sh+=`<div class="slot ${P.sel===NS?'sel':''}" style="${wc?'':'opacity:.45'}"><span class="k">5</span><div class="drop"></div><span class="n disp stroke">${Math.floor(st.water)}</span><div class="bar"><i style="width:${wc?st.water/wc*100:0}%"></i></div></div>`;$('slots').innerHTML=sh;
    {const s=st.inv[P.sel],L=vac.userData.liq;let f=0,col=0x6fd8ff;if(P.sel===NS){f=wc?st.water/wc:0}else if(s){f=s.n/cap;const[k,t]=s.id.split(':');col=k==='food'?FOODS[t].color:k==='tarr'?0x330044:SLIMES[t].color}L.visible=f>0;L.scale.y=.3*Math.max(f,.02);L.position.y=-.03+.15*f;L.material.color.setHex(col);L.material.emissive.setHex(col)}
    const s=st.inv[P.sel];$('selname').textContent=P.sel===NS?(wc?'Water':'Water (needs Water Tank)'):s?`${itemName(s.id)}  ${s.n}/${cap}`:'Empty'}
  // target
  const E=eye(),F=fwd();let best=null,bd=.975;for(const e of ents){if(e.dead||e.kind==='water')continue;const d=e.pos.clone().sub(E),l=d.length();if(l>22)continue;const dot=d.dot(F)/l;if(dot>bd){bd=dot;best=e}}
  $('reticle').classList.toggle('on',!!best&&best.pos.distanceTo(E)<14);
  let a='',ic=null;if(best){if(best.kind==='slime'){ic='slime:'+best.type;const s1=SLIMES[best.type],s2=best.type2&&SLIMES[best.type2];a=best.type2?`${s1.name}–${s2.name} Largo${best.feral?' (FERAL!)':''}`:s1.name+' Slime';
      if(best.hunger>.5)a+=best.ag>.3?' · 😠 agitated':' · 😋 hungry';}
    else if(best.kind==='gordo'){ic='slime:'+best.type;a=`${SLIMES[best.type].name} Gordo · fed ${best.eaten}/${best.need}${SLIMES[best.type].fav?' · ♥ '+FOODS[SLIMES[best.type].fav].name+' counts double':''}`}
    else if(best.kind==='tarr'){ic='tarr:tarr';a='TARR — spray it with water!'}else if(best.kind==='plort'){ic='plort:'+best.type;a=`${SLIMES[best.type].name} Plort · ₦${price(best.type)}`}else if(best.kind==='egg')a='🥚 Egg — hatching soon';else{ic='food:'+best.type;a=FOODS[best.type].name+(best.elder?' (Elder)':'')}}
  if(aimMsg){a=aimMsg;ic=null}aimMsg='';$('target').innerHTML=a?(ic?`<img src="${icon(ic)}">`:'')+`<span>${a}</span>`:'';
  curInt=null;let bi=6;for(const it of interact){if(it.on&&!it.on())continue;const d=Math.hypot(it.x-P.pos.x,it.z-P.pos.z)-(it.r-3);if(it.y!==undefined&&Math.abs(it.y-P.pos.y)>3)continue;if(d<3&&d<bi){bi=d;curInt=it}}
  for(const c of crates)if(!c.broken&&Math.hypot(c.x-P.pos.x,c.z-P.pos.z)<2.6)curInt={label:()=>'Smash crate',act:()=>breakCrate(c)};
  if(curInt){$('prompt').classList.remove('hidden');$('prompt').innerHTML='<span class="key">E</span>'+curInt.label()}else $('prompt').classList.add('hidden')}

// ================= SAVE / LOAD =================
const SAVE_KEY='slimeRanger_v2';
function save(){if(!st||!started)return;try{const ranchEnts=[];for(const e of ents){if(e.dead||e.kind==='water'||e.kind==='gordo'||e.home==='garden')continue;const z=zoneAt(e.pos.x,e.pos.z);if(!z||!['ranch','grotto','overgrowth'].includes(z.id))continue;if(e.home&&z.id==='overgrowth')continue;ranchEnts.push([e.kind,e.type,e.type2,+e.pos.x.toFixed(1),+e.pos.y.toFixed(1),+e.pos.z.toFixed(1),e.elder?1:0])}
  st.plots=plots.map(p=>({type:p.type,ups:p.ups,crop:p.crop,growT:p.growT,store:p.store,feed:p.feed,toys:p.toys}));st.ents=ranchEnts;st.ppos=[P.pos.x,P.pos.y,P.pos.z];
  localStorage.setItem(SAVE_KEY,JSON.stringify(st))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.v===2)return s}catch(e){}return null}

// ================= GAME START =================
function startGame(saved){
  for(const e of ents)if(e.kind!=='gordo')kill(e);
  st=saved||freshState();const fs=freshState();for(const k in fs)if(st[k]===undefined)st[k]=fs[k];for(const k in fs.up)if(st.up[k]===undefined)st.up[k]=0;
  plots.forEach((p,i)=>{const sp=st.plots?.[i];if(sp)Object.assign(p,{type:sp.type,ups:sp.ups||{},crop:sp.crop,growT:sp.growT||0,store:sp.store||{},feed:sp.feed||{id:null,n:0},toys:sp.toys||0});else Object.assign(p,{type:null,ups:{},crop:null});applyPlot(p)});
  if(!saved){plots[1].type='corral';applyPlot(plots[1]);plots[4].type='garden';plots[4].crop='carrot';applyPlot(plots[4]);
    for(let i=0;i<2;i++)spawn('slime','pink',new V3(-8+rand(-3,3),6,-8+rand(-3,3)));for(let i=0;i<3;i++)spawn('food','carrot',new V3(-8+rand(-2,2),6,-8+rand(-2,2)))}
  for(const k in st.exp)if(st.exp[k])applyExp(k,false);
  for(const k in st.gates)if(st.gates[k]){openGate(k,false);const g=gates[k];if(g?.gordo)kill(g.gordo);if(g?.door)g.anim=1}
  if(st.gordo.g_rock!=='burst'){const q=Z.quarry,x=q.x-22,z=q.z+12;const e=spawn('gordo','rock',new V3(x,terrainH(x,z)+3,z));e.need=50;e.gid='g_rock';e.eaten=+st.gordo.g_rock||0}
  if(st.gordo.g_honey!=='burst'){const m=Z.moss,x=m.x+18,z=m.z+14;const e=spawn('gordo','honey',new V3(x,terrainH(x,z)+3,z));e.need=50;e.gid='g_honey';e.eaten=+st.gordo.g_honey||0}
  if(gates.quarry.gordo&&!gates.quarry.open)gates.quarry.gordo.eaten=+st.gordo.gate_quarry||0;
  for(const pd of pods)if(st.pods[pd.id])openPodVis(pd);
  if(st.ents)for(const [k,t,t2,x,y,z,el] of st.ents){const e=spawn(k,t,new V3(x,y+.3,z),{type2:t2,elder:!!el});if(k==='egg')e.hatch=10}
  if(st.ppos)P.pos.set(...st.ppos);else warpHome();
  placeTurrets();P.hp=maxHp();P.en=maxEn();drawScreen();
  $('start').classList.add('hidden');$('hud').classList.remove('hidden');started=true;
  if(!saved){setTimeout(()=>toast('Welcome to the Far, Far Range! Head EAST over the bridge to the Dry Reef.',"slime:pink"),600);setTimeout(()=>toast('Press Esc for controls, P for the Slimepedia.'),3500)}
  lockPointer();save()}
function lockPointer(){initAudio();if(AC?.state==='suspended')AC.resume();if(freeLook){paused=false;return}
  try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{freeLook=true;paused=false;$('pause').classList.add('hidden')})}catch(e){freeLook=true;paused=false}}
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;if(locked){paused=false;$('pause').classList.add('hidden')}else if(started&&!menuOpen&&!freeLook)showPause()});
document.addEventListener('pointerlockerror',()=>{freeLook=true;paused=false;$('pause').classList.add('hidden');toast('Mouse lock unavailable — move the mouse or use the arrow keys to look.')});
canvas.addEventListener('click',()=>{if(started&&!locked&&!menuOpen&&!freeLook)lockPointer()});
addEventListener('mousemove',e=>{if(!started||menuOpen||paused)return;if(locked||freeLook){P.yaw-=e.movementX*.0024*SET.sens;P.pitch=clamp(P.pitch-e.movementY*.0024*SET.sens,-1.45,1.45)}});
addEventListener('mousedown',e=>{if(!started||menuOpen||paused)return;if(!locked&&!freeLook)return;if(e.button===0)vacHeld=true;if(e.button===2){shootHeld=true;shootT=0}});
addEventListener('mouseup',e=>{if(e.button===0)vacHeld=false;if(e.button===2)shootHeld=false});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('wheel',e=>{if(!started||menuOpen||paused)return;P.sel=(P.sel+(e.deltaY>0?1:-1)+NS+1)%(NS+1);hudUpdate(true)});
addEventListener('keydown',e=>{if(!started)return;
  if(menuOpen){if(e.code==='KeyE'||e.code==='Escape'||(e.code==='KeyP'&&rawMenu))closeMenu();return}
  if(paused){if(e.code==='Escape')resume();return}
  if(e.code==='Escape'&&freeLook){showPause();return}
  keys[e.code]=true;if(e.code==='Tab')e.preventDefault();
  if(e.code==='Space'){e.preventDefault();if(P.onGround){P.vel.y=9;P.onGround=false;P.jetOk=false}}
  if(e.code.startsWith('Digit')){const n=+e.code.slice(5)-1;if(n>=0&&n<=NS){P.sel=n;hudUpdate(true)}}
  if(e.code==='KeyE'&&curInt)curInt.act();
  if(e.code==='KeyF'){flashOn=!flashOn;flash.intensity=flashOn?140:0;tone(flashOn?900:600,.05,'square',.03)}if(e.code==='KeyQ')pulse();if(e.code==='KeyP')openPedia();if(e.code==='KeyJ')$('goals').classList.toggle('mini');
  if(e.code==='KeyH'&&st.gadgets.tele>0){st.gadgets.tele--;warpHome();toast('Warped home!');sfx('unlock')}
  if(e.code==='KeyM'&&st.gadgets.mlink)openMarket();
  if(e.code==='KeyR'&&st.gadgets.rlink){let n=0;st.inv.forEach((s,i)=>{if(s&&s.id.startsWith('plort:')){st.refinery[s.id]=(st.refinery[s.id]||0)+s.n;n+=s.n;st.inv[i]=null}});if(n)toast(`Sent ${n} plorts to the Refinery.`)}});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;vacHeld=shootHeld=false});

// ================= MAIN LOOP =================
let last=performance.now(),saveT=60,spawnClock=0,screenT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const T=now/1000;
  grassU.uT.value=T;waterU.t.value=T;waterU.camP.value.copy(camera.position);
  water.position.x=Math.round(camera.position.x/10)*10;water.position.z=Math.round(camera.position.z/10)*10;sky.position.copy(camera.position);
  for(const c of clouds){c.position.x+=dt*2;if(c.position.x>600)c.position.x=-450}if(windBlades)windBlades.rotation.x+=dt*.8;if(mailFlag&&st)mailFlag.visible=started&&unreadMail()>0;updMotes(T);
  for(const g of Object.values(gates))if(g.door&&g.anim!==undefined&&g.anim<1){g.anim=Math.min(1,g.anim+dt*.6)}
  for(const g of Object.values(gates))if(g.door&&g.anim!==undefined)g.door.position.y=-g.anim*8.5;
  if(started&&!menuOpen&&!paused){timeUpdate(dt);playerUpdate(dt);vacUpdate(dt);entUpdate(dt);foodTick(dt);ranchTick(dt);updFx(dt);
    spawnClock-=dt;if(spawnClock<=0){spawnClock=1.5;spawnTick()}saveT-=dt;if(saveT<=0){saveT=60;save()}screenT-=dt;if(screenT<=0){screenT=2;drawScreen()}hudUpdate()}
  else if(!started){const t=T/14;camera.position.set(-8+Math.cos(t)*26,14,-4+Math.sin(t)*26);camera.lookAt(-8,4,-6);P.pos.set(-8,-50,-6);entUpdate(dt);updFx(dt);applySky()}
  if(SET.q!=='low')composer.render();else renderer.render(scene,camera)}

// ================= BOOT =================
try{st=freshState();buildTerrain();buildDecor();buildGrass();buildClouds();setupPlots();plots.forEach(applyPlot);plots[1].type='corral';applyPlot(plots[1]);
  for(let i=0;i<4;i++)spawn('slime',pick(['pink','pink','tabby','rock']),new V3(-8+rand(-3,3),6,-8+rand(-3,3)));applyQuality();applySky();drawScreen()}
catch(err){$('loaderr').textContent='Error: '+err.message;console.error(err)}
const saved=load();if(saved)$('cont').classList.remove('hidden');
$('play').onclick=()=>{if(saved){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}startGame(null)};
$('cont').onclick=()=>startGame(saved);
$('howbtn').onclick=()=>{$('start').insertAdjacentHTML('beforeend',`<div class="overlay" id="howov"><div class="panel" style="max-width:640px"><div class="ph"><span class="ttl disp">How to Play</span><span class="x" style="cursor:pointer" id="howx">✕</span></div><div class="pb">${howTo()}</div></div></div>`);$('howx').onclick=()=>$('howov').remove()};
requestAnimationFrame(loop);
window.__game={openHouse,openPlot,openMarket,openLab,openPedia,newDay,P,ents,get st(){return st},plots,spawn,V3,terrainH,Z,gates,openGate,applyQuality,SET};
</script>
